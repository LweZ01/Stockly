<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- El CSS lo inyecta Vite vía import './style.css' en main.js -->
  </head>
  <body class="app-loading">
    <!-- ============================================================
       PANTALLA 1: AUTH (login / register)
       ============================================================ -->
    <section id="auth-screen" class="screen">
      <div class="auth-card">
        <h1 class="auth-title">Mi App</h1>
        <p class="auth-subtitle">Iniciá sesión o creá una cuenta</p>

        <!-- Form de Login -->
        <form id="login-form" class="auth-form" data-form="login">
          <h2>Iniciar sesión</h2>

          <p id="login-error" class="auth-error hidden"></p>
          <p id="login-success" class="auth-success hidden"></p>

          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          />

          <label for="login-password">Contraseña</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />

          <button type="submit" class="btn btn-primary">Ingresar</button>

          <p class="auth-switch">
            ¿No tenés cuenta?
            <button type="button" class="link-btn" data-switch-to="register">
              Registrate
            </button>
          </p>
        </form>

        <!-- Form de Register -->
        <form id="register-form" class="auth-form hidden" data-form="register">
          <h2>Crear cuenta</h2>

          <p id="register-error" class="auth-error hidden"></p>

          <label for="register-name">Nombre</label>
          <input
            type="text"
            id="register-name"
            name="name"
            placeholder="Tu nombre"
            autocomplete="name"
            required
          />

          <label for="register-email">Email</label>
          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          />

          <label for="register-password">Contraseña</label>
          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          />

          <button type="submit" class="btn btn-primary">Registrarme</button>

          <p class="auth-switch">
            ¿Ya tenés cuenta?
            <button type="button" class="link-btn" data-switch-to="login">
              Iniciá sesión
            </button>
          </p>
        </form>
      </div>
    </section>

    <!-- ============================================================
       PANTALLA 2: APP SHELL (sidebar + contenido)
       ============================================================ -->
    <section id="app-screen" class="screen hidden">
      <div class="app-layout">
        <!-- SIDEBAR (solo-íconos, con tooltip por data-tooltip en cada link) -->
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-header">
            <span class="sidebar-logo">MA</span>
            <button
              type="button"
              id="sidebar-toggle"
              class="sidebar-toggle"
              aria-label="Abrir/cerrar menú"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <line x1="4" y1="7" x2="20" y2="7" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="17" x2="20" y2="17" />
              </svg>
            </button>
          </div>

          <nav class="sidebar-nav">
            <ul>
              <li>
                <a
                  href="#"
                  class="nav-link"
                  data-route="dashboard"
                  data-tooltip="Dashboard"
                >
                  <span class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 10.5 12 3l9 7.5" />
                      <path d="M5 9.5V21h14V9.5" />
                      <path d="M9 21v-6h6v6" />
                    </svg>
                  </span>
                  <span class="nav-label">Dashboard</span>
                </a>
              </li>
              <li>
                <a
                  href="#"
                  class="nav-link"
                  data-route="products"
                  data-tooltip="Productos"
                >
                  <span class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z" />
                      <path d="M3 8l9 5 9-5" />
                      <path d="M12 13v8" />
                    </svg>
                  </span>
                  <span class="nav-label">Productos</span>
                </a>
              </li>
              <li>
                <a
                  href="#"
                  class="nav-link"
                  data-route="categories"
                  data-tooltip="Categorías"
                >
                  <span class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="m20.59 13.41-7.17 7.17a2 2 0 0 1-2.83 0L3 13V3h10l7.59 7.59a2 2 0 0 1 0 2.82Z"
                      />
                      <circle cx="7.5" cy="7.5" r="1.25" />
                    </svg>
                  </span>
                  <span class="nav-label">Categorías</span>
                </a>
              </li>
              <li>
                <a
                  href="#"
                  class="nav-link"
                  data-route="inventory"
                  data-admin-only
                  data-tooltip="Inventario"
                >
                  <span class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 3v16a2 2 0 0 0 2 2h16" />
                      <path d="M7 15v3" />
                      <path d="M12 10v8" />
                      <path d="M17 6v12" />
                    </svg>
                  </span>
                  <span class="nav-label">Inventario</span>
                </a>
              </li>
              <li>
                <a
                  href="#"
                  class="nav-link"
                  data-route="users"
                  data-admin-only
                  data-tooltip="Usuarios"
                >
                  <span class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                      <circle cx="9" cy="7" r="4" />
                      <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                  </span>
                  <span class="nav-label">Usuarios</span>
                </a>
              </li>
              <li>
                <a
                  href="#"
                  class="nav-link"
                  data-route="profile"
                  data-tooltip="Mi perfil"
                >
                  <span class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="12" cy="8" r="4" />
                      <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
                    </svg>
                  </span>
                  <span class="nav-label">Mi perfil</span>
                </a>
              </li>
            </ul>
          </nav>

          <div class="sidebar-footer">
            <div class="user-chip">
              <span id="user-name" class="user-name">—</span>
              <span id="user-role" class="user-role"></span>
            </div>
            <button
              type="button"
              id="logout-btn"
              class="btn btn-ghost"
              data-tooltip="Cerrar sesión"
            >
              <span class="nav-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
              </span>
              <span class="nav-label">Cerrar sesión</span>
            </button>
          </div>
        </aside>

        <!-- Overlay para mobile (se muestra cuando la sidebar está abierta) -->
        <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

        <!-- ÁREA DE CONTENIDO -->
        <div class="content-area">
          <header class="topbar">
            <button
              type="button"
              id="topbar-menu-btn"
              class="topbar-menu-btn"
              aria-label="Abrir menú"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <line x1="4" y1="7" x2="20" y2="7" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="17" x2="20" y2="17" />
              </svg>
            </button>
            <h1 id="view-title" class="view-title">Dashboard</h1>
          </header>

          <!-- Acá se inyectan las vistas -->
          <main id="view-root" class="view-root"></main>
        </div>
      </div>
    </section>

    <!-- Punto de entrada del JS -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
